<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso al sistema</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/asistencia.css">
</head>
<body>

  <main class="pantalla">
    <img class="logo" src="assets/image/logo.png" alt="Logo" width="64" height="56">

    <form class="tarjeta" action="dashboard.html">
      <h1>Acceso al sistema</h1>

      <div class="escaner">
        <video autoplay playsinline muted></video>
        <!-- Icono Face ID (SVG) -->
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 15V10a6 6 0 0 1 6-6h5M33 4h5a6 6 0 0 1 6 6v5M44 33v5a6 6 0 0 1-6 6h-5M15 44h-5a6 6 0 0 1-6-6v-5"/>
          <path d="M17 16v5M31 16v5M24 16v8h-3M17 33c4 3 10 3 14 0"/>
        </svg>
      </div>
      <p>Escanea tu rostro</p>

      <label>Código de empleado
        <span class="campo">
          <input type="password" placeholder="Ingrese su código">
          <i class="fa-solid fa-eye-slash"></i>
        </span>
      </label>

      <button class="boton" type="submit">Iniciar Escaneo</button>
    </form>
  </main>

  <script src="assets/js/asistencia.js"></script>
</body>
</html>
